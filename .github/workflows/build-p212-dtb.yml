name: build-p212-dtb

on:
  workflow_dispatch:
  push:
    paths:
      - 'dtb/**'
      - '.github/workflows/build-p212-dtb.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Fetch amlogic-no 5.15 kernel tree
        uses: actions/checkout@v4
        with:
          repository: CoreELEC/linux-amlogic
          ref: 5.15.196_20260306
          fetch-depth: 1
          path: kernel

      - name: Install dtc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler

      - name: Stage board files
        run: |
          cp src/dtb/*.dts kernel/arch/arm64/boot/dts/amlogic/

      - name: Compile DTBs with cpp + dtc
        run: |
          set -e
          cd kernel
          K=arch/arm64/boot/dts
          mkdir -p /tmp/out
          for f in \
            $K/amlogic/nextos-p212-1g-std.dts \
            $K/amlogic/nextos-p212-1g-slow.dts \
            $K/amlogic/meson-gxl-s905x-p212.dts \
            $K/amlogic/meson-gxl-s905w-p281.dts ; do
            base=$(basename "$f" .dts)
            echo "== $base =="
            cpp -nostdinc -I include -I $K -I $K/amlogic -undef -D__DTS__ \
              -x assembler-with-cpp "$f" -o /tmp/out/$base.dts.tmp
            dtc -I dts -O dtb -o /tmp/out/$base.dtb /tmp/out/$base.dts.tmp
          done
          echo '--- built ---'
          ls -l /tmp/out/*.dtb
          sha256sum /tmp/out/*.dtb

      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: p212-dtbs
          if-no-files-found: error
          path: /tmp/out/*.dtb
