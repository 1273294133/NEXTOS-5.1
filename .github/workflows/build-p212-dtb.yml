name: build-p212-dtb

on:
  workflow_dispatch:
  push:
    paths:
      - 'dtb/**'
      - '.github/workflows/build-p212-dtb.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Fetch amlogic-no 5.15 kernel tree
        uses: actions/checkout@v4
        with:
          repository: CoreELEC/linux-amlogic
          ref: 5.15.196_20260306
          fetch-depth: 1
          path: kernel

      - name: Install dtc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler

      - name: Compile all board DTBs
        run: |
          set -e
          K=kernel/arch/arm64/boot/dts
          mkdir -p out
          for f in src/dtb/*.dts; do
            base=$(basename "$f" .dts)
            echo "== $base =="
            cpp -nostdinc -I kernel/include -I "$K" -I "$K/amlogic" -undef -D__DTS__ \
              -x assembler-with-cpp "$f" -o "out/$base.dts.tmp"
            dtc -I dts -O dtb -o "out/$base.dtb" "out/$base.dts.tmp"
            rm -f "out/$base.dts.tmp"
          done
          echo '--- built ---'
          ls -l out/*.dtb
          sha256sum out/*.dtb

      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: p212-dtbs
          if-no-files-found: error
          path: out/*.dtb
